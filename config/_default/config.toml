# Sitemap Settings
[sitemap]
changefreq = "monthly"
priority = 0.5
filename = "sitemap.xml"

[outputs]
home = ["HTML", "RSS", "JSON"]

[markup.goldmark.renderer]
  unsafe = true


# Menu Settings
[menu]
[[menu.main]]
  identifier = "products"
  name = "Продукты"
  url = "products/"
  weight = 1
[[menu.main]]
  identifier = "services"
  name = "Услуги"
  url = "services/"
  weight = 2
[[menu.main]]
  identifier = "about"
  name = "О нас"
  url = ""
  weight = 3
  [[menu.main]]
    identifier = "contacts"
    parent = "about"
    name = "Контакты"
    url = "/contacts/"
    weight = 1
  [[menu.main]]
    identifier = "blog"
    parent = "about"
    name = "Новости"
    url = "/blog/"
    weight = 2
