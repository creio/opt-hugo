# General Settings
title = "InterOpt"
baseURL = "https://interopt-company.ru/" #YOUR SITE URL
DefaultContentLanguage = "ru" # Site language. Available translations in the theme's `/i18n` directory.
languageCode = "ru-ru"
theme = "mountain"
resourceDir = "resources"
disableHugoGeneratorInject = true
enableRobotsTXT = true

summaryLength = 50

[pagination]
  pagerSize = 4

# Main Settings
[params]
defaultLogo = "ИнтерОпт"
defaultKeywords = ["clean", "minimal", "blog", "responsive", "google analytics", "bootstrap", "under construction", "coming soon", "modern", "countdown", "hugo theme", "creative"]
defaultDescription = "Ваш надежный партнер на рынках Казахстана, России и Китая."
dateFormat = "2 Jan 2006"
authorName = "ИнтерОпт"
disqusComments = "" #YOUR DISQUS COMMENTS SHORTNAME
googleAnalytics = "" #YOUR GOOGLE ANALYTICS CODE
formsubmitEmail = "mailcreio@gmail.com"

# Preloader Settings
[params.preloader]
logo = "images/spinner.gif"

# Sidebar
[params.sidebar]
enable = 1 #SIDEBAR SHOW: [ 1 - yes, 0 - no ]
search = 1 #SIDEBAR SEARCH WIDGET: [ 1 - yes, 0 - no ]
latestPosts = 1 #SIDEBAR LATEST POSTS WIDGET: [ 1 - yes, 0 - no ]
categories = 1 #SIDEBAR CATEGORIES TAXONOMY WIDGET: [ 1 - yes, 0 - no ]
tags = 1 #SIDEBAR TAG TAXONOMY WIDGET: [ 1 - yes, 0 - no ]

# Footer Settings
[params.footer]
copyright = "ИнтерОпт © 2024. Design & Coded by <a href='http://themeforest.net/user/Mountain-Themes' target='_blank'> Mountain-Themes.</a>"

# Up Button Settings
[params.upBtn]
icon = "fa-solid fa-chevron-up"
url = "#top"

# Social Settings
[[params.social]]
title = "YouTube"
icon = "fa-brands fa-youtube"
url = "https://www.youtube.com/"
